<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>Kick Auto-Chat — Remote</title>

<!-- Home-screen install. iOS only accepts a PNG for apple-touch-icon (no SVG),
     and it ignores the manifest's icons entirely — hence both. -->
<link rel="apple-touch-icon" href="/icon-180.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="theme-color" content="#0a0a0d" />
<!-- Launch without Safari's chrome when opened from the home screen. The apple-
     prefixed one is deprecated but is still what iOS actually reads. -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Kick Remote" />
<style>
  :root{
    --bg:#0a0a0d; --card:#0f0f12; --line:#2a2a30; --dim:#9a9aa3; --fg:#e7e7ea;
    --green:#53fc18; --red:#ff4757; --blue:#9ad4ff; --amber:#ffc266;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  /* Launched from the home screen there's no Safari chrome and the status bar
     overlays the page, so keep clear of the notch top and bottom. The page is a
     fixed frame that fills the viewport — nothing scrolls except the tab panel,
     which kills iOS rubber-band overscroll on the page as a whole. */
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.45 system-ui,-apple-system,Segoe UI,Arial,sans-serif;
    padding:calc(12px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
    height:100vh;height:100dvh;overflow:hidden;overscroll-behavior:none;
    display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .dot{width:10px;height:10px;border-radius:50%;background:#666;flex:0 0 auto}
  .dot.on{background:var(--green);box-shadow:0 0 8px var(--green)}
  h1{font-size:15px;margin:0;flex:1;font-weight:700}
  .ver{font-size:11px;color:var(--dim)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
  /* The tabbed card is the one flexible region: it fills whatever height is left
     between the fixed cards above and the footer below, and clips its overflow
     so only its inner pane scrolls. */
  .card.panel{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .stat{display:flex;justify-content:space-between;gap:10px;padding:3px 0;font-size:13px}
  .stat b{color:var(--fg);font-weight:600}
  .stat span{color:var(--dim)}
  .big{font-size:26px;font-weight:800;text-align:center;padding:6px 0}
  .big.run{color:var(--green)} .big.idle{color:var(--dim)} .big.paused{color:var(--amber)}
  button{width:100%;border:none;border-radius:10px;padding:16px;font:inherit;font-weight:800;
    font-size:16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.985)}
  button:disabled{opacity:.45}
  .go{background:var(--green);color:#0a0a0a}
  .halt{background:var(--red);color:#fff}
  .sec{background:#2a2a30;color:var(--fg)}
  /* Waiting for the PC to confirm: sweep a highlight across the button so it's
     obvious the tap registered and something is in flight. */
  .pending{position:relative;overflow:hidden}
  .pending::after{content:'';position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
    transform:translateX(-100%);animation:sweep .85s linear infinite}
  @keyframes sweep{to{transform:translateX(100%)}}
  .pending.timeout{background:var(--amber);color:#0a0a0a}
  .pending.timeout::after{animation:none;background:none}
  .row{display:flex;gap:8px;margin-bottom:8px}
  .row button{margin:0}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:8px}
  .tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);
    padding:10px 6px;font-weight:700;font-size:13px;border-radius:0;width:auto}
  .tab.active{color:var(--fg);border-bottom-color:var(--green)}
  .badge{display:none;min-width:18px;padding:0 5px;border-radius:9px;background:var(--red);
    color:#fff;font-size:11px;line-height:18px;margin-left:4px}
  .list{background:#08080a;border:1px solid #16161b;border-radius:8px;padding:8px;
    flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;
    -webkit-overflow-scrolling:touch;font-size:12px;white-space:pre-wrap;word-break:break-word}
  .li{padding:3px 2px;border-bottom:1px solid #14141a}
  .li:last-child{border-bottom:none}
  .t{color:#6f6f78}
  .c{color:#7a8;font-size:11px}
  .s{color:var(--green);font-weight:700}
  .li.reply{border-left:2px solid var(--blue);padding-left:5px}
  .li.reply .s{color:var(--blue)}
  .li.quote{border-left:2px solid var(--amber);padding-left:5px}
  .li.quote .s{color:var(--amber)}
  .q{color:#6f6f78;font-size:11px;padding-left:8px}
  .err{color:#ff7b7b}
  .note{color:var(--dim);font-size:12px;text-align:center;padding:16px 8px}
  .foot{color:#5a5a63;font-size:11px;text-align:center;padding:2px 0 6px}
  /* Settings tab — a scrollable form styled to match the dark cards above. Same
     flex-fill + inner-scroll contract as .list so whichever pane is shown fills
     the panel and scrolls internally. */
  #settingsView{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
    overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
  .setGrp{margin-bottom:14px}
  .setH{font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--dim);text-transform:uppercase;
    margin:2px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .fld{display:flex;flex-direction:column;gap:5px;margin-bottom:10px}
  .fld > span{font-size:12px;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
  .fld > span i{color:var(--green);font-style:normal;font-size:11px;white-space:nowrap}
  .fld input[type=text],.fld input[type=number],.fld select{width:100%;max-width:100%;background:#08080a;
    border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:12px;font:inherit;font-size:16px;
    -webkit-appearance:none;appearance:none;box-sizing:border-box}
  .fld input:focus,.fld select:focus{outline:none;border-color:var(--green)}
  .fldRow{display:flex;gap:8px}
  .fldRow .fld{flex:1 1 0;min-width:0}
  .chk{display:flex;align-items:center;gap:10px;padding:9px 2px;font-size:14px;cursor:pointer}
  .chk input[type=checkbox]{width:22px;height:22px;flex:0 0 auto;accent-color:var(--green);margin:0}
  .chk span{flex:1;min-width:0;word-break:break-word}
</style>
</head>
<body>
<header>
  <span class="dot" id="dot"></span>
  <h1>Kick Auto-Chat — Remote</h1>
  <span class="ver" title="Version of this remote page">v{{REMOTE_VERSION}}</span>
</header>

<div class="card">
  <div class="big idle" id="bigState">connecting…</div>
  <div class="stat"><span>Target</span><b id="target">—</b></div>
  <div class="stat"><span>Next send</span><b id="next">—</b></div>
  <div class="stat"><span>Sent</span><b id="sent">—</b></div>
  <div class="stat" id="secRow" hidden><span id="secLbl">Scheduled</span><b id="secNext">—</b></div>
  <div class="stat"><span>Watching</span><b id="watch">—</b></div>
</div>

<div class="row">
  <button class="go" id="toggle" disabled>Start</button>
  <button class="sec" id="sendNow" disabled>Send now</button>
</div>
<div class="row">
  <button class="sec" id="watchBtn" disabled>Start watching</button>
</div>

<div class="card panel">
  <div class="tabs">
    <button class="tab active" id="tabLog">Log</button>
    <button class="tab" id="tabMen">Mentions <span class="badge" id="menBadge">0</span></button>
    <button class="tab" id="tabSet" aria-label="Settings">⚙</button>
  </div>
  <div class="list" id="list"></div>
  <div id="settingsView" style="display:none">
    <div class="setGrp">
      <div class="setH">Sending</div>
      <label class="fld"><span>Target channel</span>
        <input type="text" id="set_targetChannel" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="iceposeidon" /></label>
      <label class="fld"><span>Message</span>
        <input type="text" id="set_message" /></label>
      <label class="fld"><span>Interval min <i id="hint_intervalSec"></i></span>
        <input type="number" id="set_intervalSec" min="1" inputmode="numeric" /></label>
      <label class="fld"><span>Interval max <i id="hint_intervalMaxSec"></i></span>
        <input type="number" id="set_intervalMaxSec" min="1" inputmode="numeric" /></label>
      <label class="fld"><span>Cooldown min <i id="hint_cooldownSec"></i></span>
        <input type="number" id="set_cooldownSec" min="0" inputmode="numeric" /></label>
      <label class="fld"><span>Cooldown max <i id="hint_cooldownMaxSec"></i></span>
        <input type="number" id="set_cooldownMaxSec" min="0" inputmode="numeric" /></label>
      <label class="chk"><input type="checkbox" id="set_randomize" /> <span>Randomize timing &amp; order</span></label>
      <label class="chk"><input type="checkbox" id="set_antiDup" /> <span>Anti-duplicate</span></label>
      <label class="fld"><span>Rotation keywords (comma-separated)</span>
        <input type="text" id="set_rotateKeywords" placeholder="e.g. KEKW, LULW" /></label>
    </div>
    <div class="setGrp">
      <div class="setH">Scheduled</div>
      <label class="chk"><input type="checkbox" id="set_secondEnabled" /> <span>Scheduled message</span></label>
      <label class="fld"><span>Message / command</span>
        <input type="text" id="set_secondMessage" placeholder="!claim" /></label>
      <div class="fldRow">
        <label class="fld"><span>Every</span>
          <input type="number" id="set_secondValue" min="1" inputmode="numeric" /></label>
        <label class="fld"><span>Unit</span>
          <select id="set_secondUnit">
            <option value="minutes">minutes</option>
            <option value="hours">hours</option>
          </select></label>
      </div>
    </div>
    <div class="setGrp">
      <div class="setH">Watcher</div>
      <label class="chk"><input type="checkbox" id="set_watchEnabled" /> <span>Mention watcher</span></label>
      <label class="fld"><span>Your username</span>
        <input type="text" id="set_watchUsername" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="your_kick_name" /></label>
      <label class="fld"><span>Watch scope</span>
        <select id="set_watchScope">
          <option value="all">All open channels</option>
          <option value="target">Only the target channel</option>
        </select></label>
      <label class="chk"><input type="checkbox" id="set_watchSound" /> <span>Sound on mention</span></label>
      <label class="chk"><input type="checkbox" id="set_watchBareName" /> <span>Also match my name without @</span></label>
      <label class="fld"><span>Ignore senders (comma-separated)</span>
        <input type="text" id="set_ignoreSenders" placeholder="e.g. Botrix, StreamElements" /></label>
    </div>
    <div class="setGrp">
      <div class="setH">Webhook</div>
      <label class="chk"><input type="checkbox" id="set_webhookEnabled" /> <span>Forward mentions to a webhook</span></label>
      <label class="fld"><span>Webhook URL</span>
        <input type="text" id="set_webhookUrl" autocapitalize="off" autocomplete="off" spellcheck="false" placeholder="https://discord.com/api/webhooks/..." /></label>
      <label class="fld"><span>Format</span>
        <select id="set_webhookFormat">
          <option value="discord">Discord</option>
          <option value="json">Generic JSON</option>
        </select></label>
    </div>
    <div class="note">Changes apply to the PC instantly and appear in the Log tab.</div>
  </div>
</div>

<div class="foot" id="foot"></div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let tab = 'log';
  let st = null;         // last state from the PC
  let connected = false;
  // A command in flight. There's an unavoidable round trip (we queue it, the PC
  // collects it on its next sync, then reports back), so rather than guess we
  // show the button as working until the PC's own state proves it landed.
  let pending = null;    // {id, cmd, label, check(st), at}

  async function post(cmd) {
    try {
      await fetch('/cmd', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cmd }),
      });
    } catch (e) { /* server gone; the next poll will show disconnected */ }
  }

  // check(st) returns true once the PC's state reflects the command.
  function press(id, cmd, label, check) {
    pending = { id, cmd, label, check, at: Date.now() };
    render();
    post(cmd);
    poll(); // don't wait for the next tick
  }

  function settlePending() {
    if (!pending || !st) return;
    if (pending.check(st)) { pending = null; return; }
    // Nothing after ~8s means it never landed — surface that instead of
    // sweeping forever.
    if (Date.now() - pending.at > 8000) pending.failed = true;
  }

  // Paint a button, accounting for a command in flight on it.
  function paint(id, text, cls) {
    const b = $(id);
    if (pending && pending.id === id) {
      b.textContent = pending.failed ? 'No response — retry' : pending.label;
      b.className = cls + ' pending' + (pending.failed ? ' timeout' : '');
      b.disabled = !pending.failed;
    } else {
      b.textContent = text;
      b.className = cls;
      b.disabled = false;
    }
  }

  async function poll() {
    try {
      const r = await fetch('/state', { cache: 'no-store' });
      const d = await r.json();
      connected = !!d.connected;
      st = d.state || null;
    } catch (e) {
      connected = false;
    }
    render();
  }

  function fmt(sec) {
    if (sec === null || sec === undefined) return '—';
    const s = Math.max(0, sec | 0);
    if (s >= 3600) return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
    if (s >= 60) return Math.floor(s / 60) + 'm ' + (s % 60) + 's';
    return s + 's';
  }

  function stamp(iso) {
    try {
      return new Date(iso).toLocaleString([], {
        month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit', second: '2-digit',
      });
    } catch (e) { return ''; }
  }

  function render() {
    settlePending();
    $('dot').classList.toggle('on', connected && st && st.running);
    // Header carries this page's own version; the footer reports the userscript
    // version on the PC, so a mismatch between the two is visible.
    $('foot').textContent = connected && st && st.version
      ? 'PC userscript v' + st.version
      : 'PC not connected';

    const big = $('bigState');
    if (!connected || !st) {
      big.className = 'big idle';
      big.textContent = 'PC not connected';
      for (const id of ['toggle', 'sendNow', 'watchBtn']) $(id).disabled = true;
      $('list').innerHTML = '<div class="note">Waiting for the Kick tab on your PC.<br>' +
        'Make sure the kick.com tab is open and Remote control is enabled in the panel.</div>';
      return;
    }

    if (st.running && !st.onTarget) {
      big.className = 'big paused';
      big.textContent = 'PAUSED — not on @' + (st.target || '?');
    } else if (st.running) {
      big.className = 'big run';
      big.textContent = 'RUNNING';
    } else {
      big.className = 'big idle';
      big.textContent = 'STOPPED';
    }

    $('target').textContent = st.target ? '@' + st.target : '(unset)';
    $('next').textContent = st.running ? fmt(st.nextInSec) : '—';
    $('sent').textContent = st.sendCount;
    $('watch').textContent = st.watching && st.watchName ? '@' + st.watchName : 'off';

    if (st.secondMessage) {
      $('secRow').hidden = false;
      $('secLbl').textContent = st.secondMessage;
      $('secNext').textContent = st.running ? fmt(st.secondInSec) : '—';
    } else {
      $('secRow').hidden = true;
    }

    paint('toggle', st.running ? 'Stop' : 'Start', st.running ? 'halt' : 'go');
    paint('sendNow', 'Send now', 'sec');
    paint('watchBtn', st.watching ? 'Stop watching' : 'Start watching', st.watching ? 'halt' : 'sec');

    const b = $('menBadge');
    if (st.unread > 0) { b.textContent = st.unread > 99 ? '99+' : st.unread; b.style.display = 'inline-block'; }
    else b.style.display = 'none';

    fillSettings();
    renderList();
  }

  function renderList() {
    const list = $('list');
    list.textContent = '';
    if (!st) return;

    if (tab === 'log') {
      for (const l of st.log || []) {
        const d = document.createElement('div');
        d.className = 'li' + (l.e ? ' err' : '');
        const t = document.createElement('span');
        t.className = 't';
        t.textContent = '[' + stamp(l.t) + '] ';
        d.appendChild(t);
        d.appendChild(document.createTextNode(l.m));
        list.appendChild(d);
      }
      if (!(st.log || []).length) list.innerHTML = '<div class="note">No activity yet.</div>';
    } else {
      for (const m of st.mentions || []) {
        const d = document.createElement('div');
        d.className = 'li ' + m.kind;
        const t = document.createElement('span');
        t.className = 't';
        t.textContent = '[' + stamp(m.ts) + '] ';
        d.appendChild(t);
        // Which channel this mention was captured on (multi-stream monitoring).
        if (m.channel) {
          const c = document.createElement('span');
          c.className = 'c';
          c.textContent = '[' + m.channel + '] ';
          d.appendChild(c);
        }
        const s = document.createElement('span');
        s.className = 's';
        const pre = m.kind === 'reply' ? '↩ ' : m.kind === 'quote' ? '❝ ' : '';
        const re = m.kind === 'quote' && m.replyTo ? ' (re: @' + m.replyTo + ')' : '';
        s.textContent = pre + (m.sender || '?') + re + ': ';
        d.appendChild(s);
        d.appendChild(document.createTextNode(m.body || '(no text)'));
        if (m.kind === 'quote' && m.replyQuote) {
          const q = document.createElement('div');
          q.className = 'q';
          q.textContent = '↳ ' + m.replyQuote.slice(0, 140);
          d.appendChild(q);
        }
        list.appendChild(d);
      }
      if (!(st.mentions || []).length) list.innerHTML = '<div class="note">No mentions yet.</div>';
    }
    list.scrollTop = list.scrollHeight;
  }

  function setTab(t) {
    tab = t;
    $('tabLog').classList.toggle('active', t === 'log');
    $('tabMen').classList.toggle('active', t === 'men');
    $('tabSet').classList.toggle('active', t === 'set');
    const showSet = t === 'set';
    $('settingsView').style.display = showSet ? 'block' : 'none';
    $('list').style.display = showSet ? 'none' : 'block';
    if (t === 'men') post('markRead');
    if (showSet) fillSettings();
    renderList();
  }

  // ---- Settings form ------------------------------------------------------
  // One descriptor per editable key; the id in the HTML is 'set_' + key, and
  // timing fields also have a live 'hint_' + key readout ("= 1m 50s").
  const SETTINGS_FIELDS = [
    { key: 'targetChannel', type: 'text' },
    { key: 'message', type: 'text' },
    { key: 'intervalSec', type: 'int', hint: true },
    { key: 'intervalMaxSec', type: 'int', hint: true },
    { key: 'cooldownSec', type: 'int', hint: true },
    { key: 'cooldownMaxSec', type: 'int', hint: true },
    { key: 'randomize', type: 'bool' },
    { key: 'antiDup', type: 'bool' },
    { key: 'rotateKeywords', type: 'text' },
    { key: 'secondEnabled', type: 'bool' },
    { key: 'secondMessage', type: 'text' },
    { key: 'secondValue', type: 'int' },
    { key: 'secondUnit', type: 'select' },
    { key: 'watchEnabled', type: 'bool' },
    { key: 'watchUsername', type: 'text' },
    { key: 'watchScope', type: 'select' },
    { key: 'watchSound', type: 'bool' },
    { key: 'watchBareName', type: 'bool' },
    { key: 'ignoreSenders', type: 'text' },
    { key: 'webhookEnabled', type: 'bool' },
    { key: 'webhookUrl', type: 'text' },
    { key: 'webhookFormat', type: 'select' },
  ];

  const sendTimers = {};

  function updateHint(key) {
    const el = $('set_' + key), h = $('hint_' + key);
    if (!el || !h) return;
    const v = parseInt(el.value, 10);
    h.textContent = Number.isFinite(v) ? '= ' + fmt(v) : '';
  }

  // Ship one field's current value to the PC as {set:{key:value}}, then poll so
  // the confirmation (new state + the "Remote: …" log line) comes back fast.
  function sendSet(f) {
    const el = $('set_' + f.key);
    if (!el) return;
    let val;
    if (f.type === 'bool') val = el.checked;
    else if (f.type === 'int') { val = parseInt(el.value, 10); if (!Number.isFinite(val)) return; }
    else val = el.value;
    post({ set: { [f.key]: val } });
    poll();
  }

  function debounceSend(f) {
    clearTimeout(sendTimers[f.key]);
    sendTimers[f.key] = setTimeout(() => sendSet(f), 500);
  }

  function wireSettings() {
    for (const f of SETTINGS_FIELDS) {
      const el = $('set_' + f.key);
      if (!el) continue;
      if (f.type === 'bool' || f.type === 'select') {
        el.addEventListener('change', () => sendSet(f));
      } else {
        // Text/number: debounce so we don't POST on every keystroke; update the
        // live hint immediately for a responsive feel.
        el.addEventListener('input', () => {
          if (f.hint) updateHint(f.key);
          debounceSend(f);
        });
      }
    }
  }

  // Populate the form from st.settings. Never clobber a control the user is
  // actively editing (the PC pushes fresh state every second).
  function fillSettings() {
    if (!st || !st.settings) return;
    const s = st.settings;
    for (const f of SETTINGS_FIELDS) {
      const el = $('set_' + f.key);
      if (!el || el === document.activeElement) continue;
      if (f.type === 'bool') el.checked = !!s[f.key];
      else el.value = (s[f.key] == null ? '' : s[f.key]);
      if (f.hint) updateHint(f.key);
    }
  }

  $('toggle').onclick = () => {
    if (!st) return;
    const want = !st.running;
    press('toggle', want ? 'start' : 'stop', want ? 'Starting…' : 'Stopping…',
      (s) => s.running === want);
  };
  $('sendNow').onclick = () => {
    if (!st) return;
    // Confirmed by the sent counter ticking up — real proof it went out.
    const base = st.sendCount;
    press('sendNow', 'sendNow', 'Sending…', (s) => s.sendCount > base);
  };
  $('watchBtn').onclick = () => {
    if (!st) return;
    const want = !st.watching;
    press('watchBtn', want ? 'watchOn' : 'watchOff', want ? 'Starting…' : 'Stopping…',
      (s) => s.watching === want);
  };
  $('tabLog').onclick = () => setTab('log');
  $('tabMen').onclick = () => setTab('men');
  $('tabSet').onclick = () => setTab('set');
  wireSettings();

  // Poll harder while a command is in flight so confirmation feels immediate,
  // then back off to keep the phone quiet.
  (async function loop() {
    await poll();
    setTimeout(loop, pending ? 350 : 1200);
  })();
})();
</script>
</body>
</html>
