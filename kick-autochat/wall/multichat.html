<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kick Multi-Chat Wall v1.0.0</title>
<!--
  Kick Multi-Chat Wall v1.0.0
  Standalone, self-contained monitoring wall for multiple Kick chats.

  VIEW-ONLY: each cell is a cross-origin <iframe> loading
  https://kick.com/popout/<channel>/chat . This page cannot and must not
  try to read inside those iframes (cross-origin). Sending messages is
  handled separately by the Kick Auto-Chat Tampermonkey extension running
  on its own popout tab of the target channel.

  RESILIENCE NOTE: if Kick blocks framing via X-Frame-Options or a CSP
  frame-ancestors directive, the iframes will render blank / "refused to
  connect". That is entirely outside this page's control. The fallback
  (not implemented here) would be a websocket-based chat viewer that
  connects to Kick's chatroom socket directly. This build is the iframe
  version as specified.
-->
<style>
  :root{
    --bg:#0a0a0d;
    --card:#0f0f12;
    --border:#2a2a30;
    --text:#e7e7ea;
    --dim:#9a9aa3;
    --accent:#53fc18;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);
    color:var(--text);
    font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    height:100dvh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
  }

  /* Controls bar */
  .bar{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    padding:10px 14px;
    background:var(--card);
    border-bottom:1px solid var(--border);
  }
  .bar .brand{
    font-weight:700;
    letter-spacing:.2px;
    color:var(--text);
    white-space:nowrap;
  }
  .bar .brand .ver{
    color:var(--dim);
    font-weight:400;
    font-size:12px;
    margin-left:6px;
  }
  .bar input[type="text"]{
    flex:1 1 320px;
    min-width:180px;
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 10px;
    font:inherit;
    outline:none;
  }
  .bar input[type="text"]:focus{border-color:var(--accent)}
  .bar label{color:var(--dim);white-space:nowrap}
  .bar select{
    background:var(--bg);
    color:var(--text);
    border:1px solid var(--border);
    border-radius:8px;
    padding:8px 8px;
    font:inherit;
    outline:none;
  }
  .bar select:focus{border-color:var(--accent)}
  .btn{
    background:var(--accent);
    color:#06210a;
    border:0;
    border-radius:8px;
    padding:8px 14px;
    font:inherit;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .btn:hover{filter:brightness(1.08)}
  .btn.secondary{
    background:transparent;
    color:var(--text);
    border:1px solid var(--border);
    font-weight:400;
  }
  .btn.secondary:hover{border-color:var(--accent)}
  .hint{
    color:var(--dim);
    font-size:12px;
    flex:1 1 260px;
    min-width:200px;
  }

  /* Grid area */
  .wrap{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;
    overflow-x:hidden;
    padding:10px;
  }
  .grid{
    display:grid;
    gap:10px;
    grid-template-columns:repeat(var(--cols,2), minmax(0,1fr));
    height:100%;
  }

  .cell{
    display:flex;
    flex-direction:column;
    min-width:0;
    min-height:320px;
    background:var(--card);
    border:1px solid var(--border);
    border-radius:10px;
    overflow:hidden;
  }
  .cell header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    gap:8px;
    padding:6px 8px;
    background:#141418;
    border-bottom:1px solid var(--border);
  }
  .cell header .name{
    font-weight:700;
    color:var(--text);
    min-width:0;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    flex:1 1 auto;
  }
  .cell header .name::before{
    content:"";
    display:inline-block;
    width:7px;height:7px;
    border-radius:50%;
    background:var(--accent);
    margin-right:7px;
    vertical-align:middle;
  }
  .iconbtn{
    flex:0 0 auto;
    background:transparent;
    color:var(--dim);
    border:1px solid var(--border);
    border-radius:6px;
    width:26px;height:26px;
    line-height:1;
    font-size:13px;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
    padding:0;
  }
  .iconbtn:hover{color:var(--text);border-color:var(--accent)}
  .cell iframe{
    flex:1 1 auto;
    width:100%;
    border:0;
    background:#000;
    min-height:0;
  }

  /* Empty state */
  .empty{
    height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
  }
  .empty .inner{max-width:460px}
  .empty h2{margin:0 0 10px;color:var(--text);font-size:18px}
  .empty p{margin:6px 0;color:var(--dim);font-size:13px}
  .empty code{
    color:var(--accent);
    background:#141418;
    border:1px solid var(--border);
    border-radius:5px;
    padding:1px 6px;
  }
</style>
</head>
<body>
  <div class="bar">
    <span class="brand">Kick Multi-Chat<span class="ver">v1.0.0</span></span>
    <input id="channels" type="text" autocomplete="off" spellcheck="false"
           placeholder="channels, comma-separated (e.g. shoovy, iceposeidon, xqc)">
    <label for="cols">Columns</label>
    <select id="cols">
      <option value="2">2</option>
      <option value="3">3</option>
      <option value="4">4</option>
    </select>
    <button id="apply" class="btn">Apply</button>
    <span class="hint">View-only monitor. Send with the Kick Auto-Chat extension on a popout tab of your target channel.</span>
  </div>

  <div class="wrap">
    <div id="grid" class="grid"></div>
  </div>

<script>
(function(){
  "use strict";

  var LS_KEY = "kick-multichat:config";
  var SLUG_RE = /^[a-z0-9_-]+$/;

  // Normalize any of: username, @handle, kick.com/<ch>, kick.com/popout/<ch>/chat
  // into a bare lowercase slug. Returns "" if nothing usable.
  function normChannel(str){
    if(str == null) return "";
    var s = String(str).trim();
    if(!s) return "";

    // If it looks like a kick.com URL/path, pull out the channel slug.
    var lower = s.toLowerCase();
    var idx = lower.indexOf("kick.com/");
    if(idx !== -1){
      var path = s.slice(idx + "kick.com/".length); // after the host
      // strip query/hash
      path = path.split("?")[0].split("#")[0];
      var parts = path.split("/").filter(function(p){ return p.length > 0; });
      if(parts.length === 0) return "";
      if(parts[0].toLowerCase() === "popout"){
        // /popout/<ch>/chat
        s = parts[1] || "";
      } else {
        // /<ch>
        s = parts[0];
      }
    }

    // strip leading @
    s = s.replace(/^@+/, "");
    // strip anything after a / ? or #
    s = s.split("/")[0].split("?")[0].split("#")[0];
    s = s.trim().toLowerCase();
    return s;
  }

  function parseChannels(input){
    var out = [];
    var seen = {};
    String(input || "").split(",").forEach(function(raw){
      var slug = normChannel(raw);
      if(!slug) return;
      if(!SLUG_RE.test(slug)) return; // only [a-z0-9_-]
      if(seen[slug]) return;
      seen[slug] = true;
      out.push(slug);
    });
    return out;
  }

  var state = { channels: [], cols: 2 };

  function load(){
    try{
      var raw = localStorage.getItem(LS_KEY);
      if(raw){
        var cfg = JSON.parse(raw);
        if(Array.isArray(cfg.channels)){
          state.channels = cfg.channels
            .map(normChannel)
            .filter(function(s){ return s && SLUG_RE.test(s); });
          // de-dupe
          state.channels = parseChannels(state.channels.join(","));
        }
        var c = parseInt(cfg.cols, 10);
        if(c === 2 || c === 3 || c === 4) state.cols = c;
      }
    }catch(e){ /* ignore corrupt config */ }
  }

  function save(){
    try{
      localStorage.setItem(LS_KEY, JSON.stringify({
        channels: state.channels,
        cols: state.cols
      }));
    }catch(e){ /* storage may be unavailable */ }
  }

  var gridEl = document.getElementById("grid");
  var channelsInput = document.getElementById("channels");
  var colsSelect = document.getElementById("cols");
  var applyBtn = document.getElementById("apply");

  function chatSrc(slug){
    // slug is guaranteed [a-z0-9_-] by parseChannels, safe in a URL path.
    return "https://kick.com/popout/" + slug + "/chat";
  }

  function makeIconBtn(label, title){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "iconbtn";
    b.textContent = label;
    b.title = title;
    b.setAttribute("aria-label", title);
    return b;
  }

  function buildCell(slug){
    var cell = document.createElement("div");
    cell.className = "cell";

    var head = document.createElement("header");

    var name = document.createElement("span");
    name.className = "name";
    name.textContent = slug;            // textContent: never inject markup
    name.title = slug;
    head.appendChild(name);

    // reload just this iframe
    var reload = makeIconBtn("↻", "Reload " + slug);
    head.appendChild(reload);

    // open channel in a new tab
    var open = document.createElement("a");
    open.className = "iconbtn";
    open.textContent = "↗";
    open.title = "Open kick.com/" + slug;
    open.setAttribute("aria-label", "Open kick.com/" + slug);
    open.href = "https://kick.com/" + slug;
    open.target = "_blank";
    open.rel = "noopener noreferrer";
    head.appendChild(open);

    // remove this channel
    var close = makeIconBtn("✕", "Remove " + slug);
    head.appendChild(close);

    cell.appendChild(head);

    var frame = document.createElement("iframe");
    frame.src = chatSrc(slug);
    frame.title = slug;
    frame.setAttribute("referrerpolicy", "no-referrer");
    frame.setAttribute("loading", "lazy");
    // NOTE: intentionally NO sandbox attribute — sandbox breaks Kick chat.
    cell.appendChild(frame);

    reload.addEventListener("click", function(){
      // Re-set src to reload just this frame.
      frame.src = chatSrc(slug);
    });

    close.addEventListener("click", function(){
      state.channels = state.channels.filter(function(c){ return c !== slug; });
      save();
      render();
    });

    return cell;
  }

  function render(){
    gridEl.style.setProperty("--cols", String(state.cols));

    // clear
    while(gridEl.firstChild) gridEl.removeChild(gridEl.firstChild);

    if(state.channels.length === 0){
      gridEl.style.display = "block";
      var empty = document.createElement("div");
      empty.className = "empty";
      var inner = document.createElement("div");
      inner.className = "inner";

      var h = document.createElement("h2");
      h.textContent = "No channels yet";
      inner.appendChild(h);

      var p1 = document.createElement("p");
      p1.textContent = "Enter Kick channels above, comma-separated, then press Apply.";
      inner.appendChild(p1);

      var p2 = document.createElement("p");
      var code = document.createElement("code");
      code.textContent = "shoovy, iceposeidon, xqc";
      p2.appendChild(code);
      inner.appendChild(p2);

      var p3 = document.createElement("p");
      p3.textContent = "View-only monitor. Send messages with the Kick Auto-Chat extension on a popout tab of your target channel.";
      inner.appendChild(p3);

      empty.appendChild(inner);
      gridEl.appendChild(empty);
      return;
    }

    gridEl.style.display = "grid";
    state.channels.forEach(function(slug){
      gridEl.appendChild(buildCell(slug));
    });
  }

  function syncControls(){
    channelsInput.value = state.channels.join(", ");
    colsSelect.value = String(state.cols);
  }

  function apply(){
    state.channels = parseChannels(channelsInput.value);
    var c = parseInt(colsSelect.value, 10);
    state.cols = (c === 3 || c === 4) ? c : 2;
    save();
    syncControls();
    render();
  }

  applyBtn.addEventListener("click", apply);
  channelsInput.addEventListener("keydown", function(e){
    if(e.key === "Enter") apply();
  });
  colsSelect.addEventListener("change", function(){
    var c = parseInt(colsSelect.value, 10);
    state.cols = (c === 3 || c === 4) ? c : 2;
    save();
    render();
  });

  // init
  load();
  syncControls();
  render();

  // Expose for debugging / testing (harmless).
  window.__kickMultiChat = { normChannel: normChannel, parseChannels: parseChannels };
})();
</script>
</body>
</html>
